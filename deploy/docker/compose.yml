# Virtual Book en contenedores: API, Postgres y Redis, aislados del resto de la máquina.
# Guía y pasos: deploy/docker/LEEME.md. Se usa con un archivo de variables FUERA del repositorio:
#
#   docker compose -f deploy/docker/compose.yml --env-file ~/.config/virtualbook/docker.env up -d
#
# nginx sigue en el sistema (actualizaciones de seguridad de Ubuntu, certificado de Let's Encrypt) y manda los pedidos a
# los puertos de la API, que solo escuchan en 127.0.0.1. Postgres y Redis no publican ningún puerto: solo los ve la API.

name: ${VB_PROYECTO:-virtualbook}

x-endurecido: &endurecido
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  postgres:
    <<: *endurecido
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: virtualbook
      POSTGRES_USER: ${PG_USUARIO:?falta PG_USUARIO}
      POSTGRES_PASSWORD: ${PG_CLAVE:?falta PG_CLAVE}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - max_connections=100
    shm_size: 256m
    volumes:
      - pgdatos:/var/lib/postgresql/data
      # Para restaurar respaldos y dejar los nuevos donde ya están hoy.
      - ${VB_RESPALDOS:?falta VB_RESPALDOS}:/respaldos
    networks: [interna]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d virtualbook"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORIA:-2g}
          cpus: "${PG_CPUS:-4}"

  redis:
    <<: *endurecido
    image: redis:7.4.9-bookworm
    # Solo guarda los contadores de los límites de pedidos: sin persistencia, con tope de memoria.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [interna]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
          cpus: "1"

  api:
    <<: *endurecido
    image: virtualbook-api:${VB_VERSION:-local}
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    # El .env de siempre (secretos, URLs, MP, SMTP). Lo de abajo en `environment` tiene prioridad sobre él.
    env_file: ${VB_API_ENV:?falta VB_API_ENV}
    environment:
      HOST: 0.0.0.0
      PORT: "5050"
      DATABASE_URL: postgresql://${PG_USUARIO}:${PG_CLAVE}@postgres:5432/virtualbook
      REDIS_URL: redis://redis:6379
      SQLITE_PATH: /datos/diccionario/Diccionario.sqlite
      SQLITE_READONLY: "true"
      # nginx llega a través del reenvío de puertos de Docker (desde una dirección privada, no desde 127.0.0.1).
      TRUST_PROXY: loopback, uniquelocal
    # Cada réplica toma un puerto libre del rango (`--scale api=N`, hasta 4). nginx ya reparte entre 5050-5053.
    ports:
      - "127.0.0.1:${VB_PUERTOS:-5050-5053}:5050"
    volumes:
      - ${VB_DICCIONARIO:?falta VB_DICCIONARIO}:/datos/diccionario:ro
      - ${VB_MEDIA:?falta VB_MEDIA}:/app/api/media
    networks: [interna, salida]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${VB_REPLICAS:-2}
      resources:
        limits:
          memory: ${API_MEMORIA:-1g}
          cpus: "${API_CPUS:-2}"
    stop_grace_period: 30s

networks:
  # Sin salida a internet: Postgres y Redis no pueden conectarse a nada de afuera.
  interna:
    internal: true
  # La API sí necesita salir (Mercado Pago, correo, notificaciones).
  salida: {}

volumes:
  pgdatos:
