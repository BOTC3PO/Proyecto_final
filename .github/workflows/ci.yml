# G4 — integración continua: tipos, lint, pruebas (API, web, app sin conexión y contra Postgres real) y compuerta
# de seguridad.
# No hay secretos: las claves de las pruebas son valores descartables.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vb
          POSTGRES_PASSWORD: vb
          POSTGRES_DB: virtualbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vb -d virtualbook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JWT_SECRET: ci-jwt-secret-descartable
      DATABASE_URL: postgresql://vb:vb@localhost:5432/virtualbook_test
      PG_TEST_DATABASE_URL: postgresql://vb:vb@localhost:5432/virtualbook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - name: Tipos de la API
        run: pnpm --filter api typecheck
      - name: Lint de la API (falla con errores; los avisos no cuentan)
        run: pnpm --filter api lint
      - name: Migraciones desde cero (base vacía)
        run: pnpm --filter api exec prisma migrate deploy
      - name: Que ninguna prueba quede fuera de la lista
        run: pnpm --filter api check:tests
      - name: Pruebas de la API (base en memoria)
        run: pnpm --filter api test
      - name: Pruebas de la API contra Postgres real
        run: pnpm --filter api test:pg

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Tipos y compilación de la web
        run: pnpm --filter web build
        env:
          VITE_API_BASE_URL: https://ci.invalid
      # La web tiene errores de lint heredados: la compuerta falla solo ante errores nuevos (tools/lint-web-base.json).
      - name: Lint de la web (sin errores nuevos)
        run: node tools/lint-gate.mjs
      - name: Pruebas de la web
        run: pnpm --filter web test
      # El mapa del temario (apps/web/public/temario/mapa.json) sale de content/: si cambia el temario hay que regenerarlo.
      - name: Mapa del temario al día
        run: |
          python3 content/material/_qa_tools/exportar_mapa.py /tmp/mapa.json
          cmp /tmp/mapa.json apps/web/public/temario/mapa.json || { echo "Regenerar con: python3 content/material/_qa_tools/exportar_mapa.py"; exit 1; }

  sin-conexion:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.3.4
      - run: pnpm install --frozen-lockfile
      - name: Tipos de la app sin conexión
        run: pnpm --filter offline tipos
      - name: Pruebas de la API local
        run: pnpm --filter offline test
      - name: Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      # Solo el núcleo (base y archivos): no depende de Tauri ni de bibliotecas del sistema.
      - name: Pruebas del núcleo (Rust)
        run: cargo test --locked -p vb-nucleo
        working-directory: apps/offline

  seguridad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.3.4
      # Falla ante avisos altos/críticos nuevos fuera de la app móvil (ver tools/audit-aceptados.json).
      - name: pnpm audit
        run: node tools/audit-gate.mjs
