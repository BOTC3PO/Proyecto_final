[package]
name = "virtualbook-offline"
version = "0.1.0"
description = "Virtual Book sin conexión"
edition = "2021"
rust-version = "1.99"

[lib]
name = "virtualbook_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
base64 = "=0.22.1"
tauri = { version = "=2.12.4", features = [] }
vb-nucleo = { path = "../nucleo" }
serde_json = "1"
