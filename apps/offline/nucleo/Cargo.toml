[package]
name = "vb-nucleo"
version = "0.1.0"
description = "Base y archivos de la app sin conexión de Virtual Book (sin Tauri: lo usan la app y el modo navegador)"
edition = "2021"
rust-version = "1.99"

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
